<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
  </defs>
  
  <!-- Container Quadrado com Cantos Arredondados ("Quadradinho do App") -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#BAE6FD" stroke-width="8" />

  <!-- Símbolo Gráfico Oficial Ppueri (Adulto & Criança em tons de Azul) -->
  <g transform="translate(56, 56) scale(4)">
    <!-- 1. Cabeça do Adulto / Cuidador (Azul Marinho #173A70) -->
    <circle cx="33" cy="22" r="12" fill="#173A70" />

    <!-- 2. Cabeça da Criança no Colo (Azul Claro Sereno #94C1F6) -->
    <circle cx="65" cy="42" r="9.5" fill="#94C1F6" />

    <!-- 3. Corpo e Abraço do Adulto (Azul Marinho #173A70) -->
    <path
      d="M 28 35
         C 16 42, 8 56, 8 72
         C 8 86, 15 97, 18 108
         C 20 114, 27 114, 28 108
         C 30 98, 26 88, 22 78
         C 18 68, 19 57, 28 50
         C 36 43, 47 44, 54 53
         C 58 58, 54 64, 46 65
         C 38 66, 30 60, 26 53
         C 24 50, 18 54, 20 60
         C 24 71, 35 76, 46 74
         C 57 72, 64 63, 61 52
         C 57 39, 42 33, 28 35 Z"
      fill="#173A70"
      transform="scale(0.85) translate(4, 2)"
    />

    <!-- 4. Corpo e Acolhimento da Criança (Azul Claro Sereno #94C1F6) -->
    <path
      d="M 64 52
         C 60 54, 54 57, 50 62
         C 44 69, 36 73, 28 76
         C 25 77, 24 81, 28 82
         C 38 84, 52 81, 62 72
         C 72 63, 76 53, 72 47
         C 69 44, 66 49, 64 52 Z"
      fill="#94C1F6"
      transform="scale(0.85) translate(4, 2)"
    />
